spring.application.name=game-platform

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:gamedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Enable H2 console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Let JPA create schema first, then run data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT — override JWT_SECRET in production via env var
jwt.secret=${JWT_SECRET:game-platform-super-secret-key-must-be-at-least-32-characters}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
